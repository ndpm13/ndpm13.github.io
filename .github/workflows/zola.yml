name: Build and deploy Zola website

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: "0.22.1-1"
    steps:
      - name: Install Zola CLI
        run: |
          wget -O ${{ runner.temp }}/zola.deb https://github.com/barnumbirr/zola-debian/releases/download/v${ZOLA_VERSION}/zola_${ZOLA_VERSION}_amd64_trixie.deb \
          && sudo dpkg -i ${{ runner.temp }}/zola.deb

      - name: checkout
        uses: actions/checkout@v6.0.1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Zola
        run: |
          zola build \
            --minify \
            --base-url "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
